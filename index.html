<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Would You Pay?">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Post something with a price tag. Everyone votes: would you pay this much?">
<title>Would You Pay This Much?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #0a0a0a; --ink-2: #525252; --ink-3: #a3a3a3;
    --line: #ececec; --line-2: #d9d9d9; --hover: #f5f5f5; --chip: #f4f4f4;
    --yes: #16a34a; --no: #dc2626; --track: #ececec;
    --sheet: #ffffff; --scrim: rgba(0,0,0,.35);
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --ink: #fafafa; --ink-2: #a3a3a3; --ink-3: #5c5c5c;
      --line: #1f1f1f; --line-2: #333333; --hover: #161616; --chip: #1a1a1a;
      --yes: #22c55e; --no: #f87171; --track: #262626;
      --sheet: #141414; --scrim: rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  /* Top bar */
  .top {
    position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))) 0 calc(-1 * max(16px, env(safe-area-inset-left)));
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .brand .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 14px; }
  .new-btn {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
    height: 34px; padding: 0 14px; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 6px;
  }
  .new-btn svg { width: 14px; height: 14px; }
  .tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: 0; padding: 4px 0 12px; font-size: 14px; font-weight: 500; color: var(--ink-3);
    white-space: nowrap; position: relative; flex: none;
  }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }

  .intro { padding: 28px 0 8px; }
  .intro h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 700; margin: 0; }
  .intro p { color: var(--ink-2); margin: 8px 0 0; }
  .preview { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 3px 10px; }

  /* Rows */
  .item { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .item h2 { font-size: 17px; line-height: 1.35; font-weight: 600; letter-spacing: -0.015em; margin: 0; overflow-wrap: anywhere; }
  .item .desc { color: var(--ink-2); margin: 3px 0 0; overflow-wrap: anywhere; }
  .price { flex: none; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .meta { color: var(--ink-3); font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 500; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; }
  .pill.worth { color: var(--yes); } .pill.over { color: var(--no); } .pill.split { color: var(--ink-2); }

  .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .vote {
    height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent;
    font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, border-color .15s, color .15s, transform .08s;
  }
  .vote svg { width: 15px; height: 15px; }
  .vote:active { transform: scale(.98); }
  .vote.yes.mine { color: var(--yes); border-color: var(--yes); background: color-mix(in srgb, var(--yes) 8%, transparent); }
  .vote.no.mine { color: var(--no); border-color: var(--no); background: color-mix(in srgb, var(--no) 8%, transparent); }
  @media (hover: hover) { .vote:not(.mine):hover { background: var(--hover); } }

  .result { margin-top: 12px; }
  .track { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .track span { display: block; height: 100%; background: var(--yes); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .split-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
  .split-row .y { color: var(--yes); font-weight: 500; } .split-row .n { color: var(--ink-2); }

  .fair { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--chip); }
  .fair-q { font-size: 13px; font-weight: 500; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg);
    font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .chip.mine { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .fair-a { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .fair-a b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
  .fair-a + .chips { margin-top: 10px; }

  .empty { text-align: center; color: var(--ink-2); padding: 56px 0; }
  .empty button { margin-top: 12px; }
  footer { color: var(--ink-3); font-size: 13px; text-align: center; margin-top: 32px; }

  /* Compose sheet */
  dialog {
    border: 0; padding: 0; background: var(--sheet); color: var(--ink); width: 100%; max-width: 520px;
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  dialog::backdrop { background: var(--scrim); }
  @media (max-width: 600px) {
    dialog { margin: auto 0 0; max-width: none; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    dialog[open] { animation: up .25s cubic-bezier(.2,.8,.2,1); }
  }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet { padding: 18px 16px 16px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .x { background: none; border: 0; width: 32px; height: 32px; border-radius: 50%; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .x:hover { background: var(--hover); }
  .field-row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .money { position: relative; }
  .money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-weight: 600; pointer-events: none; }
  .money input { padding-left: 26px; font-variant-numeric: tabular-nums; }
  input, textarea {
    width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 12px;
    font: 16px/1.4 var(--sans); color: var(--ink); background: transparent; resize: none;
    -webkit-appearance: none; appearance: none;
  }
  input { font-weight: 500; }
  textarea { margin-top: 8px; }
  input::placeholder, textarea::placeholder { color: var(--ink-3); font-weight: 400; }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  .sheet-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .count { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .count.over { color: var(--no); }
  .post-btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; height: 40px; padding: 0 20px; font-weight: 500; }
  .post-btn:disabled { opacity: .3; cursor: default; }
  .err { color: var(--no); font-size: 13px; margin-top: 8px; }
  .err:empty { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand"><span class="mark">$</span>Would you pay?</div>
      <button class="new-btn" id="newBtn" aria-label="Post a price">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Post
      </button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-sort="hot">Hot</button>
      <button class="tab" data-sort="new">New</button>
      <button class="tab" data-sort="worth">Worth it</button>
      <button class="tab" data-sort="over">Overpriced</button>
      <button class="tab" data-sort="contested">Contested</button>
    </nav>
  </header>

  <section class="intro">
    <h1>Would you pay this much?</h1>
    <p>Post a used car, bike, or other big-ticket item with its asking price. Everyone votes yes or no, then names the price they'd actually pay.</p>
    <span class="preview">Preview · sample data, votes saved on this device only</span>
  </section>

  <main id="list"></main>
  <footer>Tap your vote again to undo it.</footer>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form class="sheet" id="post" method="dialog">
    <div class="sheet-head">
      <h3 id="sheetTitle">Post a price</h3>
      <button type="button" class="x" id="closeBtn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="field-row">
      <input id="text" maxlength="80" placeholder="2015 Subaru Outback, 120k" autocomplete="off" enterkeyhint="next" aria-label="What is it?">
      <label class="money"><span>$</span><input id="price" inputmode="decimal" placeholder="9500" autocomplete="off" enterkeyhint="next" aria-label="Price ($100 minimum)"></label>
    </div>
    <textarea id="desc" rows="2" maxlength="200" placeholder="Condition, mileage, extras (optional)" enterkeyhint="done"></textarea>
    <div class="sheet-foot">
      <span class="count" id="count">80</span>
      <button class="post-btn" id="postBtn" disabled>Post</button>
    </div>
    <div class="err" id="err"></div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const VERDICT_MIN = 5;
const MIN_PRICE = 100;
const HOUR = 3600;
const ICON_YES = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
const ICON_NO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;

// Placeholder data. Swap this layer for a real backend later: SAMPLE becomes a
// database query, and the localStorage `state` becomes per-user rows.
const now = Date.now() / 1000;
const SAMPLE = [
  { id: "s1", text: "2014 Honda Civic LX, 112k miles", desc: "Clean title, new tires, one owner.", price: 8500, yes: 47, no: 52, fair: [6500, 7000, 7000, 6000, 7500], created: now - 2 * HOUR },
  { id: "s2", text: "Trek Marlin 7 mountain bike, 2019", desc: "Size large, new brake pads, a few scratches.", price: 650, yes: 38, no: 29, fair: [450, 500, 500, 400], created: now - 4 * HOUR },
  { id: "s3", text: "2018 Ford F-150 XLT, 89k miles", desc: "4x4, tow package, no accidents.", price: 24000, yes: 61, no: 33, fair: [20000, 21000, 19000, 21500], created: now - 7 * HOUR },
  { id: "s4", text: "Peloton bike, barely used", desc: "Comes with shoes and weights. No subscription.", price: 900, yes: 22, no: 71, fair: [400, 500, 450, 350, 500, 400], created: now - 10 * HOUR },
  { id: "s5", text: "2008 Toyota Camry, 180k miles", desc: "Runs great, some dents, cold AC.", price: 4200, yes: 55, no: 31, fair: [3200, 3500, 3000], created: now - 14 * HOUR },
  { id: "s6", text: "Rad Power RadCity e-bike", desc: "1,200 miles, battery replaced last year.", price: 1100, yes: 34, no: 36, fair: [800, 850, 750, 900], created: now - 18 * HOUR },
  { id: "s7", text: "2016 Jeep Wrangler Unlimited, 95k miles", desc: "Lifted, 33 inch tires, hardtop and soft top.", price: 22500, yes: 44, no: 41, fair: [18000, 19000, 18500, 17000], created: now - 23 * HOUR },
  { id: "s8", text: "2012 Harley-Davidson Sportster, 14k miles", desc: "Garage kept, new battery, extra seat.", price: 6800, yes: 29, no: 40, fair: [5000, 5500, 5000, 4500], created: now - 28 * HOUR },
  { id: "s9", text: "Restored 1985 Peugeot road bike", desc: "Steel frame, new cables and tires.", price: 400, yes: 41, no: 18, fair: [300, 325, 275], created: now - 34 * HOUR },
  { id: "s10", text: "2011 BMW 328i, 138k miles", desc: "Leather, sunroof, check engine light on.", price: 7900, yes: 12, no: 64, fair: [4500, 5000, 4000, 5000, 3500], created: now - 40 * HOUR },
];

const STORE_KEY = "wyp-state-v1";
let state = { posts: [], votes: {}, fair: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch {}
const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} };

let sort = "hot";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "$" + (Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

// Combine the base counts with this device's vote and fair-price pick.
function items() {
  return [...state.posts, ...SAMPLE].map(base => {
    const myVote = state.votes[base.id] || 0;
    const myFair = state.fair[base.id];
    return {
      ...base, myVote, myFair,
      yes: base.yes + (myVote === 1 ? 1 : 0),
      no: base.no + (myVote === -1 ? 1 : 0),
      fair: myFair != null ? [...base.fair, myFair] : base.fair,
    };
  });
}

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 1800);
}

function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 60) return "just now";
  if (s < HOUR) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / HOUR) + "h";
  return Math.floor(s / 86400) + "d";
}

const total = i => i.yes + i.no;
const scorers = {
  hot: i => (total(i) + 1) / Math.pow((Date.now() / 1000 - i.created) / HOUR + 2, 1.5),
  new: i => i.created,
  worth: i => total(i) ? i.yes / total(i) + total(i) / 1e6 : -1,
  over: i => total(i) ? i.no / total(i) + total(i) / 1e6 : -1,
  contested: i => total(i) ? total(i) * (1 - Math.abs(i.yes - i.no) / total(i)) : -1,
};

function verdict(i) {
  if (total(i) < VERDICT_MIN) return "";
  const pct = i.yes / total(i);
  if (pct >= 0.6) return `<span class="pill worth">Worth it</span>`;
  if (pct <= 0.4) return `<span class="pill over">Overpriced</span>`;
  return `<span class="pill split">Split</span>`;
}

function median(nums) {
  if (!nums.length) return null;
  const s = [...nums].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Round suggested prices to something a person would actually say.
function niceRound(n) {
  if (n < 10) return Math.round(n * 2) / 2;
  if (n < 100) return Math.round(n);
  if (n < 1000) return Math.round(n / 25) * 25;
  if (n < 10000) return Math.round(n / 50) * 50;
  return Math.round(n / 500) * 500;
}
// Used-item haggling usually lands 10-30% under asking, so offer those counteroffers.
const fairChoices = price => [...new Set([0.9, 0.8, 0.7].map(f => niceRound(price * f)))].filter(n => n > 0);

function fairBlock(i) {
  if (i.myVote !== -1) return "";
  const crowd = median(i.fair);
  const chips = fairChoices(i.price).map(n =>
    `<button class="chip ${i.myFair === n ? "mine" : ""}" data-fair="${n}">${money(n)}</button>`).join("");
  if (i.myFair == null) {
    return `<div class="fair"><div class="fair-q">What would you pay?</div><div class="chips">${chips}</div></div>`;
  }
  return `<div class="fair">
    <div class="fair-a"><span>Crowd's fair price</span><b>${money(niceRound(crowd))}</b></div>
    <div class="chips">${chips}</div>
  </div>`;
}

function card(i) {
  const voted = i.myVote !== 0;
  const pct = total(i) ? Math.round(i.yes / total(i) * 100) : 0;
  return `
  <article class="item" data-id="${i.id}">
    <div class="item-head">
      <div>
        <h2>${esc(i.text)}</h2>
        ${i.desc ? `<p class="desc">${esc(i.desc)}</p>` : ""}
      </div>
      <div class="price">${money(i.price)}</div>
    </div>
    <div class="meta">${ago(i.created)} · ${total(i)} vote${total(i) === 1 ? "" : "s"}${voted ? verdict(i) : ""}</div>
    <div class="votes">
      <button class="vote yes ${i.myVote === 1 ? "mine" : ""}" data-v="1">${ICON_YES}I'd pay</button>
      <button class="vote no ${i.myVote === -1 ? "mine" : ""}" data-v="-1">${ICON_NO}No way</button>
    </div>
    ${voted ? `
    <div class="result">
      <div class="track"><span style="width:${pct}%"></span></div>
      <div class="split-row"><span class="y">${pct}% would pay</span><span class="n">${100 - pct}% wouldn't</span></div>
    </div>` : ""}
    ${fairBlock(i)}
  </article>`;
}

function render() {
  const sorted = items().sort((a, b) => scorers[sort](b) - scorers[sort](a));
  $("list").innerHTML = sorted.length ? sorted.map(card).join("")
    : `<div class="empty">Nothing posted yet.<br><button class="post-btn" onclick="openSheet()">Post the first price</button></div>`;
}

function rerenderCard(id) {
  const fresh = items().find(i => i.id === id);
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (el && fresh) el.outerHTML = card(fresh);
}

$("list").addEventListener("click", e => {
  const voteBtn = e.target.closest(".vote");
  const fairBtn = e.target.closest(".chip");
  const id = e.target.closest(".item")?.dataset.id;
  if (!id) return;
  if (voteBtn) {
    const v = Number(voteBtn.dataset.v);
    if (state.votes[id] === v) delete state.votes[id]; else state.votes[id] = v;
    if (state.votes[id] !== -1) delete state.fair[id];
    if (navigator.vibrate) navigator.vibrate(8);
  } else if (fairBtn) {
    const n = Number(fairBtn.dataset.fair);
    if (state.fair[id] === n) delete state.fair[id]; else state.fair[id] = n;
  } else return;
  persist();
  // Re-render just this card so the list doesn't jump around under your finger.
  rerenderCard(id);
});

$("tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
  sort = tab.dataset.sort;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

function openSheet() {
  $("err").textContent = "";
  $("sheet").showModal();
  setTimeout(() => $("text").focus(), 50);
}
$("newBtn").addEventListener("click", openSheet);
$("closeBtn").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").close(); });

const parsePrice = () => {
  const n = parseFloat($("price").value.replace(/[^0-9.]/g, ""));
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
};
function validate() {
  const left = 80 - $("text").value.length;
  $("count").textContent = left;
  $("count").classList.toggle("over", left < 10);
  $("postBtn").disabled = $("text").value.trim().length < 3 || parsePrice() == null;
}
$("text").addEventListener("input", validate);
$("price").addEventListener("input", validate);
$("text").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("price").focus(); } });
$("price").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("desc").focus(); } });

$("post").addEventListener("submit", e => {
  e.preventDefault();
  const price = parsePrice();
  if (price == null || price > 1e7) { $("err").textContent = "Enter a price, like 8500."; return; }
  if (price < MIN_PRICE) { $("err").textContent = `Prices start at ${money(MIN_PRICE)}. Post something bigger.`; return; }
  state.posts.unshift({
    id: "u" + Date.now().toString(36), text: $("text").value.trim(), desc: $("desc").value.trim(),
    price, yes: 0, no: 0, fair: [], created: Date.now() / 1000,
  });
  persist();
  $("post").reset();
  validate();
  $("sheet").close();
  document.querySelector('.tab[data-sort="new"]').click();
  toast("Posted");
});

render();
</script>
</body>
</html>
